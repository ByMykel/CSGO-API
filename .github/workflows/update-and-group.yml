name: Update and Group JSON API

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every configured batch even if source commits are unchanged
        type: boolean
        default: false
  repository_dispatch:
    types: [game-images-updated]
  push:
    paths:
      - '.github/workflows/update-and-group.yml'
      - 'fork-locales/*.py'
      - 'fork-locales/*.mjs'

permissions:
  contents: read

concurrency:
  group: csgo-api-publisher-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  update-and-group:
    if: >-
      github.repository != 'ByMykel/CSGO-API' &&
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      FORCE_REBUILD: ${{ inputs.force }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test updater helpers
        run: |
          node --test fork-locales/test-*.mjs
          python3 -m unittest discover -s fork-locales -p 'test_*.py'
      - name: Synchronize en/zh-CN and process the 15 language batches sequentially
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$FORCE_REBUILD" == "true" ]]; then flags+=(--force); fi
          python3 fork-locales/sync.py --repository "$GITHUB_WORKSPACE" \
            --report-dir "$RUNNER_TEMP/csgo-reports" "${flags[@]}"
      - name: Publish all validated updates in one commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/api/{en,zh-CN,pt-BR,ru,es-ES,bg,ro,sv,zh-TW,cs,da,nl,fi,fr,de,el,hu,it,ja,ko,es-MX,no,pl,pt-PT,tr,uk,vi} \
            fork-locales/state.json fork-locales/last-run.json fork-locales/heartbeat.json
          if git diff --cached --quiet; then
            echo 'No API or heartbeat changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.compression=9 commit -m 'chore: update 27 API languages in validated batches'
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Save source and per-batch validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csgo-update-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/csgo-reports
          if-no-files-found: ignore
          retention-days: 14
